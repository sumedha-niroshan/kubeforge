---
- name: Check if this node has already been initialized
  stat:
    path: /etc/kubernetes/admin.conf
  register: admin_conf

- name: Initialize the Kubernetes control plane (kubeadm init)
  command: >
    kubeadm init
    --pod-network-cidr={{ pod_network_cidr }}
    --upload-certs
    --control-plane-endpoint={{ ansible_host }}
  when: not admin_conf.stat.exists
  register: kubeadm_init

- name: Create .kube directory for the ansible_user
  file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Copy admin.conf into the user's kubeconfig
  copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'

- name: Install the Calico CNI (pod networking)
  become_user: "{{ ansible_user }}"
  environment:
    KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
  command: "kubectl apply -f {{ calico_manifest_url }}"
  when: not admin_conf.stat.exists

- name: Generate a fresh kubeadm join command
  command: kubeadm token create --print-join-command
  register: join_command_raw
  changed_when: false

- name: Save join command to the Ansible control node (for the worker role)
  copy:
    content: "{{ join_command_raw.stdout }}"
    dest: /tmp/kubeforge_join_command.sh
    mode: '0755'
  delegate_to: localhost
  become: false
